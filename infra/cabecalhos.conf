# Cabeçalhos do painel do Lucro Certo — servidos pelo nginx da instância.
#
# O molde é o do painel do MKT (mesmo formato, mesmo validador
# `mzn-cabecalhos-do-front` no mzn_infra), com uma política MAIS FECHADA: este
# painel não tem SDK de terceiro, não abre iframe e não lê CDN. Tudo que ele
# carrega é dele mesmo — as fotos vêm de /api/arquivos, na mesma origem, e as
# fontes (Inter e Manrope, as do mock) vão no próprio build, pelo @fontsource.
# O `src/testes/cabecalhos.test.ts` reprova quem afrouxar.
#
# Só linhas `add_header <Nome> "<valor>" always;`. O HSTS é do servidor.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-src 'none'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
